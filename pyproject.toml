[project]
name = "vuelos"
version = "0.1.0"
description = "Bot de Telegram que vigila precios de vuelos y avisa cuando bajan"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10",
    "fast-flights>=3.1.0",
    # fast-flights 3.1.0 lo importa sin declararlo: sin esto no arranca (tarea 2.1b)
    "typing_extensions>=4.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vuelos.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
